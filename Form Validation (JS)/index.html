<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form action="" onsubmit="formSubmit(event)">

        <div class="form-header">
            <span class="eyebrow">Practice Form</span>
            <h1>Registration Form</h1>
            <p class="subtext">Fill in your details below to register.</p>
        </div>

        <div class="form-body">

            <label for="name">Name
                <input type="text" name="" id="name">
            </label>
            <span class="err-msg" id="name_err"></span>

            <label for="fatherName">Father Name
                <input type="text" name="" id="fatherName">
            </label>
            <span class="err-msg" id="father_err"></span>

            <label for="email">Email
                <input type="email" name="" id="email">
            </label>
            <span class="err-msg" id="email_err"></span>

            <label for="password">Password
                <input type="password" name="" id="password">
            </label>
            <span class="err-msg" id="pass_err"></span>

            <label for="dob">Date of Birth
                <input type="date" name="" id="dob">
            </label>
            <span class="err-msg" id="dob_err"></span>

            <label for="phNo">Phone No.
                <input type="tel" name="" id="phNo">
            </label>
            <span class="err-msg" id="num_err"></span>

            <div class="field-group">
                <span class="group-label">Gender</span>
                <div class="chip-row">
                    <label class="chip">
                        <input type="radio" name="gender" id="" value="male">
                        <span>Male</span>
                    </label>
                    <label class="chip">
                        <input type="radio" name="gender" id="" value="female">
                        <span>Female</span>
                    </label>
                </div>
            </div>
            <span class="err-msg" id="genderErr"></span>

            <div class="field-group">
                <span class="group-label">Skills</span>
                <div class="chip-row">
                    <label class="chip">
                        <input type="checkbox" name="skill" id="" value="HTML">
                        <span>HTML</span>
                    </label>
                    <label class="chip">
                        <input type="checkbox" name="skill" id="" value="CSS">
                        <span>CSS</span>
                    </label>
                    <label class="chip">
                        <input type="checkbox" name="skill" id="" value="JavaScript">
                        <span>JavaScript</span>
                    </label>
                </div>
            </div>
            <span class="err-msg" id="skillErr"></span>

            <label for="city">City
                <select name="" id="city">
                    <option value="" selected>Select City</option>
                    <option value="Islamabad">Islamabad</option>
                    <option value="Karachi">Karachi</option>
                    <option value="Lahore">Lahore</option>
                </select>
            </label>
            <span class="err-msg" id="cityErr"></span>

            <label for="bio">Bio Data
                <textarea name="" id="bio" rows="4"></textarea>
            </label>

            <input type="submit" value="Submit" class="btn">

        </div>
    </form>

    <table border="1px solid black">
        <thead>
            <tr>
                <th>Name</th>
                <th>Father Name</th>
                <th>Email</th>
                <th>Phone Number</th>
                <th>DOB</th>
                <th>City</th>
                <th>Gender</th>
                <th>Skills</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="table_body">

        </tbody>
    </table>

    <script src="script.js"></script>
</body>

</html>
