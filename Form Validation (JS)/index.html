<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form action="" onsubmit="formSubmit(event)">
        <label for="">Name
            <input type="text" name="" id="name">
        </label> <br>
        <p id="name_err"></p>
        <br>
        <label for="">Father Name
            <input type="text" name="" id="fatherName">
        </label>
        <p id="father_err"></p>
         <br><br>
        <label for="">Email
            <input type="email" name="" id="email">
        </label>
        <p id="email_err"></p>
         <br><br>
        <label for="">Password
            <input type="password" name="" id="password">
        </label>
        <p id="pass_err"></p>

        <br><br> <label for="">Date of Birth
            <input type="date" name="" id="dob">
        </label>
        <p id="dob_err"></p>
         <br><br>
        <label for="">Phone No.
            <input type="number" name="" id="phNo">
        </label>
        <p id="num_err"></p>
         <br><br>
        <label for="">Gender: <br>
        <input type="radio" name="gender" id="" value="male">Male <br>
        <input type="radio" name="gender" id="" value="female">Female
        </label>
        <br> <br>

        <label for="">Skills: <br><br>
            <input type="checkbox" name="skill" id="" value="HTML">HTML <br>
            <input type="checkbox" name="skill" id="" value="CSS">CSS <br>
            <input type="checkbox" name="skill" id="" value="JavaScript">JAVASCRIPT <br>

            <p id="skillErr"></p>

        </label> <br><br>

        <label for="">
            City:

            <select name="" id="">
                <option value="" selected>Select City</option>
                <option value="">Islamabad</option>
                <option value="">Karachi</option>
                <option value="">Lahore</option>
            </select>
        </label> <br><br>

        <label for="">Enter Bio Data
            <textarea name="" id=""></textarea>
        </label> <br><br>

        <input type="submit" value="submit">

    </form>


    <script src="script.js"></script>
</body>

</html>
