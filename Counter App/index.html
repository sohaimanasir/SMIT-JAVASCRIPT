<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="counterBox">
        <h2 id="head">Counter</h2>
        <div class="countNum">
        <h1 id="counter">0</h1>
        </div>
        <div class="btn">
            <button id="increment" onclick="increaseCount()">+</button>
            <button id="reset" onclick="resetCount()">reset</button>
            <button id="decrement" onclick="decreaseCount()">-</button>

        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
